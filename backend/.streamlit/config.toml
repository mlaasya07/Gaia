[theme]
base = "light"
primaryColor = "#007C78"
backgroundColor = "#F7F8F5"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172A2A"
borderColor = "#D8E1DD"
font = "Source Sans 3:https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap"
headingFont = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
baseRadius = "small"
buttonRadius = "small"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = ["#007C78", "#D4663A", "#437DA0", "#6E8C49", "#B28B35", "#735B4A"]

[theme.sidebar]
backgroundColor = "#EEF2EF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172A2A"
borderColor = "#D8E1DD"
